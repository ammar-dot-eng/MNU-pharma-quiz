          <p class="why" id="why"></p>
          <div class="actions">
            <button class="btn primary" id="next" type="button">Next question</button>
          </div>
        </div>
      </article>
    </section>

    <section class="results" id="results" hidden aria-labelledby="result-title">
      <article class="card">
        <h2 class="result-title" id="result-title" tabindex="-1"></h2>
        <p class="result-sub" id="result-sub"></p>
        <div class="result-stats">

          <div><span class="big-sm" id="result-streak">0</span><span class="unit">best streak</span></div>

        <section class="remember" id="remember" hidden>
          <h3>What to remember</h3>
          <ul id="missed-list"></ul>
        </section>
        <div class="actions">
          <button class="btn ghost" id="play-again" type="button">Play again</button>
          <button class="btn primary" id="fill" type="button"></button>
        </div>
      </article>
    </section>

    <div class="bench" id="bench" aria-label="Your shelf">
      <div class="slots" id="slots"></div>
    </div>
  </main>
</div>

  var TIME_MS = 20000;
  var CIRC = 150.8;

  var $ = function (id) { return document.getElementById(id); };
  var quizEl = $("quiz");
  var resultsEl = $("results");
  var slotsEl = $("slots");
  var benchEl = $("bench");
  var questionCard = $("question-card");
  var questionEl = $("question");
  var choicesEl = $("choices");
  var feedbackEl = $("feedback");
  var verdictEl = $("verdict");
  var whyEl = $("why");
  var nextBtn = $("next");
  var progEl = $("prog");
  var secsEl = $("secs");

  var items = new Array(10).fill(false);
  var slots = [];
  var state = null;
  var lastMissed = [];

  function shuffle(list) {
    var a = list.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function buildSlots() {
    var html = "";
    for (var i = 0; i < 10; i++) {
      html += '<div class="slot" data-slot="' + i + '"><span class="ghost"></span>' +
        '<svg class="item" viewBox="0 0 60 84" aria-hidden="true"></svg></div>';
    }
    slotsEl.innerHTML = html;
    slots = Array.prototype.slice.call(slotsEl.querySelectorAll(".slot"));
  }

  function prepare(source) {
    var wrong = [];
    for (var i = 0; i < source.options.length; i++) {
      if (i !== source.answer) wrong.push(source.options[i]);
    }
    var correctText = source.options[source.answer];
    var options = shuffle(wrong.concat([correctText]));
    return { source: source, options: options, correctIndex: options.indexOf(correctText) };
  }

  function resetBench() {
    items = new Array(10).fill(false);
    slots.forEach(function (slot) {
      slot.classList.remove("filled");
      slot.querySelector(".item").innerHTML = "";
    });
    benchEl.classList.remove("waiting");
  }

  function startGame(mode) {
    if (mode === "full") resetBench();
    var pool = mode === "full" ? QUESTIONS : lastMissed.slice();
    state = {
      mode: mode,
      queue: shuffle(pool).map(prepare),
      idx: 0,
      score: 0,
      streak: 0,
      best: 0,
      correct: 0,
      missed: [],
      answered: false,
      timeLeft: TIME_MS,
      startedAt: 0,
      timer: null
    };
    benchEl.classList.remove("waiting");
    resultsEl.hidden = true;
    quizEl.hidden = false;
    updateStats();
    renderQuestion();
  }

  function updateStats() {
    $("score").textContent = state.score.toLocaleString();
    $("streak").textContent = state.streak;
  }

  function renderQuestion() {
    var item = state.queue[state.idx];
    $("meta").textContent = "Question " + (state.idx + 1) + " of " + state.queue.length;
    questionEl.textContent = item.source.question;
    choicesEl.innerHTML = "";
    item.options.forEach(function (text, i) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "choice";
      var key = document.createElement("span");
      key.className = "key";
      key.textContent = LETTERS[i];
      var label = document.createElement("span");
      label.textContent = text;
      b.appendChild(key);
      b.appendChild(label);
      b.addEventListener("click", function () { answer(i); });
      choicesEl.appendChild(b);
    });
    feedbackEl.classList.remove("show");
    verdictEl.className = "verdict";
    verdictEl.textContent = "";
    whyEl.textContent = "";
    questionCard.classList.remove("low");
    state.answered = false;
    questionEl.focus({ preventScroll: true });
    startTimer();
  }

  function paintDial(ms) {
    var frac = ms / TIME_MS;
    progEl.style.strokeDashoffset = (CIRC * (1 - frac)).toFixed(1);
    secsEl.textContent = Math.ceil(ms / 1000);
    questionCard.classList.toggle("low", ms <= 5000);
  }

  function startTimer() {
    state.startedAt = performance.now();
    state.timeLeft = TIME_MS;
    paintDial(TIME_MS);
    clearInterval(state.timer);
    state.timer = setInterval(function () {
      state.timeLeft = Math.max(0, TIME_MS - (performance.now() - state.startedAt));
      paintDial(state.timeLeft);
      if (state.timeLeft <= 0) {
        clearInterval(state.timer);
        answer(-1);
      }
    }, 100);
  }

  function answer(choice) {
    if (!state || state.answered) return;
    state.answered = true;
    clearInterval(state.timer);

    var item = state.queue[state.idx];
    var isCorrect = choice === item.correctIndex;
    var secsLeft = Math.max(0, Math.ceil(state.timeLeft / 1000));

    Array.prototype.forEach.call(choicesEl.children, function (b, i) {
      b.disabled = true;
      if (i === item.correctIndex) b.classList.add("correct");
      else if (i === choice) b.classList.add("wrong");
      else b.classList.add("dim");
    });

    if (isCorrect) {
      state.streak += 1;
      state.best = Math.max(state.best, state.streak);
      state.correct += 1;
      var mult = Math.min(2, 1 + 0.5 * Math.floor(state.streak / 3));
      var gained = Math.round((100 + 2 * secsLeft) * mult);
      state.score += gained;
      verdictEl.textContent = "Right. +" + gained;
      verdictEl.className = "verdict";
      fillNextSlot();
    } else {
      state.streak = 0;
      state.missed.push(item.source);
      verdictEl.textContent = choice === -1 ? "Time's up." : "Not quite.";
      verdictEl.className = "verdict bad";
    }

    whyEl.textContent = item.source.why;
    feedbackEl.classList.add("show");
    nextBtn.textContent = state.idx === state.queue.length - 1 ? "See the shelf" : "Next question";
    updateStats();
    nextBtn.focus({ preventScroll: true });
  }

  function fillNextSlot() {
    var i = items.indexOf(false);
    if (i === -1) return;
    items[i] = true;
    slots[i].querySelector(".item").innerHTML = ITEMS[i];
    slots[i].classList.add("filled");
  }

  function endRound() {
    lastMissed = state.missed.slice();
    var missed = state.missed.length;
    quizEl.hidden = true;
    resultsEl.hidden = false;

    $("result-title").textContent = missed === 0
      ? "The shelf is full."
      : missed + (missed === 1 ? " ring left open." : " rings left open.");
    $("result-sub").textContent = "You answered " + state.correct + " of " + state.queue.length + " correctly.";
    $("result-score").textContent = state.score.toLocaleString();
    $("result-streak").textContent = state.best;

    var list = $("missed-list");
    list.innerHTML = "";
    state.missed.forEach(function (src) {
      var li = document.createElement("li");
      var q = document.createElement("p");
      q.className = "m-q";
      q.textContent = src.question;
      var a = document.createElement("p");
      a.className = "m-a";
      a.textContent = src.options[src.answer];
      var w = document.createElement("p");
      w.className = "m-why";
      w.textContent = src.why;
      li.appendChild(q);
      li.appendChild(a);
      li.appendChild(w);
      list.appendChild(li);
    });

    $("remember").hidden = missed === 0;
    var fillBtn = $("fill");
    fillBtn.hidden = missed === 0;
    fillBtn.textContent = "Fill the " + missed + (missed === 1 ? " empty ring" : " empty rings");
    $("result-title").focus({ preventScroll: true });
    benchEl.classList.add("waiting");
  }

  nextBtn.addEventListener("click", function () {
    state.idx += 1;
    if (state.idx >= state.queue.length) endRound();
    else renderQuestion();
  });

  $("play-again").addEventListener("click", function () { startGame("full"); });
  $("fill").addEventListener("click", function () { startGame("missed"); });

  document.addEventListener("keydown", function (e) {
    if (!state || state.answered || !resultsEl.hidden) return;
    var count = choicesEl.children.length;
    var i = -1;
    var digits = "1234";
    var letters = "abcd";
    if (digits.indexOf(e.key) !== -1) i = digits.indexOf(e.key);
    else if (letters.indexOf(e.key.toLowerCase()) !== -1) i = letters.indexOf(e.key.toLowerCase());
    if (i !== -1 && i < count) {
      e.preventDefault();
      answer(i);
    }
  });

  buildSlots();
  startGame("full");
})();
</script>
</body>
</html>
