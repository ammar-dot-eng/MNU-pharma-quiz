<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Niosome Apothecary</title>
<meta name="description" content="A cozy ten-question quiz on niosomes. Watch a vial of niosomal medicine being made as you answer.">
<meta name="theme-color" content="#241a12">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232b1d12'/%3E%3Ccircle cx='32' cy='32' r='17' fill='none' stroke='%2379c7b8' stroke-width='3'/%3E%3Ccircle cx='32' cy='32' r='7' fill='%23ffcf8a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="room">
  <header class="masthead">
    <div class="title">
      <h1>The Niosome Apothecary</h1>
      <p>Ten questions. Watch the medicine being made.</p>
    </div>
    <div class="gauges">
      <div class="scoreline"><span class="v" id="score">0</span><span class="l">points</span></div>
      <button class="sound" id="sound" type="button" aria-pressed="true" aria-label="Sound on">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <main class="stage">
    <div class="game">
      <section class="quiz" id="quiz" aria-labelledby="question">
        <article class="card">
          <div class="q-head">
            <p class="meta" id="meta">Question 1 of 10</p>
            <div class="dial" aria-hidden="true">
              <svg viewBox="0 0 56 56">
                <circle class="track" cx="28" cy="28" r="24"></circle>
                <circle class="prog" id="prog" cx="28" cy="28" r="24"></circle>
              </svg>
              <span class="secs" id="secs">20</span>
            </div>
          </div>
          <h2 class="question" id="question" tabindex="-1"></h2>
          <div class="choices" id="choices" role="group" aria-labelledby="question"></div>
          <div class="feedback" id="feedback" role="status" aria-live="polite">
            <p class="verdict" id="verdict"></p>
            <p class="why" id="why"></p>
            <div class="actions">
              <button class="btn primary" id="next" type="button">Next question</button>
            </div>
          </div>
        </article>
      </section>

      <section class="results" id="results" hidden aria-labelledby="result-title">
        <article class="card">
          <p class="kicker">Dawn</p>
          <h2 class="result-title" id="result-title" tabindex="-1"></h2>
          <p class="result-sub" id="result-sub"></p>
          <div class="result-stats">
            <div><span class="big" id="result-score">0</span><span class="unit">points</span></div>
            <div><span class="big-sm" id="result-correct">0/10</span><span class="unit">answered</span></div>
          </div>
          <section class="remember" id="remember" hidden>
            <h3>What to remember</h3>
            <ul id="missed-list"></ul>
          </section>
          <div class="actions">
            <button class="btn ghost" id="share" type="button">Share</button>
            <button class="btn ghost" id="replay" type="button">Play again</button>
            <button class="btn primary" id="mend" type="button">Try the missed questions</button>
          </div>
          <p class="share-note" id="share-note" hidden>Copied. Paste it wherever you like.</p>
        </article>
      </section>
    </div>

    <aside class="specimen" aria-label="A vial of niosomal medicine being made">
      <div class="jar">
        <div class="canvas-wrap" id="canvas-wrap"></div>
        <span class="jar-shine" aria-hidden="true"></span>
      </div>
      <p class="caption"><span id="step-name">a clean vial</span><small><b id="assembled">0</b> / 10 steps</small></p>
      <p class="drag-hint">drag to turn</p>
    </aside>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script src="game.js"></script>
</body>
</html>
