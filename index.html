<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Niosome Apothecary</title>
<meta name="description" content="A cozy ten-question quiz on niosomes. Watch a vial of niosomal medicine being made as you answer.">
<meta name="theme-color" content="#241a12">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232b1d12'/%3E%3Ccircle cx='32' cy='32' r='17' fill='none' stroke='%2379c7b8' stroke-width='3'/%3E%3Ccircle cx='32' cy='32' r='7' fill='%23ffcf8a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="room">
  <header class="masthead">
    <div class="title">
      <h1>The Niosome Apothecary</h1>
      <p>Ten questions. Watch the medicine being made.</p>
    </div>
    <div class="gauges">
      <div class="scoreline"><span class="v" id="score">0</span><span class="l">points</span></div>
      <button class="sound" id="sound" type="button" aria-pressed="true" aria-label="Sound on">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <main class="stage">
    <div class="game">
      <section class="quiz" id="quiz" aria-labelledby="question">
        <article class="card">
          <div class="q-head">
            <p class="meta" id="meta">Question 1 of 10</p>
            <div class="dial" aria-hidden="true">
              <svg viewBox="0 0 56 56">
                <circle class="track" cx="28" cy="28" r="24"></circle>
                <circle class="prog" id="prog" cx="28" cy="28" r="24"></circle>
              </svg>
              <span class="secs" id="secs">20</span>
            </div>
          </div>
          <h2 class="question" id="question" tabindex="-1"></h2>
          <div class="choices" id="choices" role="group" aria-labelledby="question"></div>
          <div class="feedback" id="feedback" role="status" aria-live="polite">
            <p class="verdict" id="verdict"></p>
            <p class="why" id="why"></p>
            <div class="actions">
              <button class="btn primary" id="next" type="button">Next question</button>
            </div>
          </div>
        </article>
      </section>

      <section class="results" id="results" hidden aria-labelledby="result-title">
        <article class="card">
          <p class="kicker">Dawn</p>
          <h2 class="result-title" id="result-title" tabindex="-1"></h2>
          <p class="result-sub" id="result-sub"></p>
          <div class="result-stats">
            <div><span class="big" id="result-score">0</span><span class="unit">points</span></div>
            <div><span class="big-sm" id="result-correct">0/10</span><span class="unit">answered</span></div>
          </div>
          <section class="remember" id="remember" hidden>
            <h3>What to remember</h3>
            <ul id="missed-list"></ul>
          </section>
          <div class="actions">
            <button class="btn ghost" id="share" type="button">Share</button>
            <button class="btn ghost" id="replay" type="button">Play again</button>
            <button class="btn primary" id="mend" type="button">Try the missed questions</button>
          </div>
          <p class="share-note" id="share-note" hidden>Copied. Paste it wherever you like.</p>
        </article>
      </section>
    </div>

    <aside class="specimen" aria-label="A vial of niosomal medicine being made">
      <div class="bench-frame">
        <svg class="bench-svg" id="bench-svg" viewBox="0 0 420 520" role="img" aria-label="An apothecary bench where a vial of medicine is being compounded">
          <defs>
            <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#195148"/><stop offset="1" stop-color="#0a241f"/></linearGradient>
            <radialGradient id="glow" cx="50%" cy="44%" r="58%"><stop offset="0" stop-color="#f6c477" stop-opacity=".45"/><stop offset="1" stop-color="#f6c477" stop-opacity="0"/></radialGradient>
            <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d29054"/><stop offset="1" stop-color="#8a552b"/></linearGradient>
            <linearGradient id="woodDark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7c4a26"/><stop offset="1" stop-color="#452714"/></linearGradient>
            <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e2f8f1" stop-opacity=".22"/><stop offset=".45" stop-color="#e2f8f1" stop-opacity=".05"/><stop offset="1" stop-color="#e2f8f1" stop-opacity=".16"/></linearGradient>
            <linearGradient id="liquid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7adcc0"/><stop offset="1" stop-color="#2f8a76"/></linearGradient>
            <linearGradient id="liquidWarm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6cc7c"/><stop offset="1" stop-color="#c98a3a"/></linearGradient>
            <clipPath id="bottleClip"><path d="M162 218 Q162 198 178 192 L190 188 L190 162 L230 162 L230 188 L242 192 Q258 198 258 218 L258 364 Q258 378 244 378 L176 378 Q162 378 162 364 Z"/></clipPath>
            <filter id="soft"><feGaussianBlur stdDeviation="4"/></filter>
          </defs>

          <rect width="420" height="520" fill="url(#bg)"/>
          <ellipse cx="210" cy="300" rx="190" ry="220" fill="url(#glow)"/>
          <path d="M96 400 V214 Q96 128 210 128 Q324 128 324 214 V400 Z" fill="#0d2f29" opacity=".55" stroke="rgba(246,196,119,.16)" stroke-width="1.5"/>

          <g>
            <rect x="26" y="196" width="104" height="9" rx="2" fill="url(#wood)"/>
            <rect x="34" y="164" width="16" height="32" rx="3" fill="#7fb0a5"/><rect x="36" y="158" width="12" height="7" rx="1.5" fill="#8a5a35"/>
            <rect x="58" y="170" width="14" height="26" rx="3" fill="#d78f8f"/><rect x="60" y="164" width="10" height="7" rx="1.5" fill="#8a5a35"/>
            <rect x="80" y="160" width="18" height="36" rx="4" fill="#e0a83e"/><rect x="84" y="154" width="10" height="7" rx="1.5" fill="#8a5a35"/>
            <rect x="104" y="174" width="14" height="22" rx="3" fill="#a99bd1"/>
          </g>

          <g>
            <path d="M352 116 V150" stroke="#6f4527" stroke-width="2"/>
            <path d="M352 150 q -20 10 -17 36 q 15 -8 17 -36" fill="#5c8a52"/>
            <path d="M352 150 q 20 10 17 36 q -15 -8 -17 -36" fill="#6f9e63"/>
            <path d="M352 150 q -6 22 0 42 q 7 -20 0 -42" fill="#86b877"/>
          </g>

          <g>
            <ellipse cx="52" cy="334" rx="26" ry="12" fill="#f6c477" opacity=".16" filter="url(#soft)"/>
            <rect x="42" y="330" width="20" height="48" rx="4" fill="#f2e0b8"/>
            <rect x="50" y="322" width="4" height="9" fill="#8a5a35"/>
            <path class="flame" d="M52 312 q 7 8 0 13 q -7 -5 0 -13" fill="#ffcf7a"/>
          </g>

          <rect x="16" y="378" width="388" height="22" fill="url(#wood)"/>
          <rect x="16" y="400" width="388" height="104" fill="url(#woodDark)"/>
          <path d="M16 418 H404 M16 442 H404 M16 466 H404 M16 490 H404" stroke="#2f1a0c" stroke-opacity=".45" stroke-width="2"/>

          <g>
            <path d="M74 348 a26 18 0 0 0 52 0 z" fill="#c9a15a"/>
            <ellipse cx="100" cy="348" rx="26" ry="6" fill="#8a5a35"/>
            <ellipse cx="100" cy="348" rx="18" ry="3.5" fill="#6f4127"/>
            <rect x="112" y="326" width="6" height="26" rx="3" fill="#b98a4c" transform="rotate(20 115 339)"/>
          </g>

          <g id="vial">
            <ellipse cx="210" cy="379" rx="52" ry="7" fill="#000" opacity=".28"/>
            <g clip-path="url(#bottleClip)">
              <g class="liquid">
                <rect class="liquid-fill" x="150" y="196" width="120" height="190" fill="url(#liquid)"/>
                <path class="wave" d="M150 202 q 15 -6 30 0 t 30 0 t 30 0 t 30 0 v 10 h -120 z" fill="url(#liquid)"/>
              </g>
              <g class="powder">
                <path d="M176 375 Q210 352 244 375 Z" fill="#d9a441"/>
                <circle class="p p1" cx="196" cy="222" r="2.4" fill="#e8c27a"/>
                <circle class="p p2" cx="210" cy="206" r="2" fill="#e8c27a"/>
                <circle class="p p3" cx="226" cy="226" r="2.6" fill="#e8c27a"/>
                <circle class="p p4" cx="204" cy="200" r="1.8" fill="#e8c27a"/>
              </g>
              <g class="vesicles">
                <g transform="translate(198,336)"><g class="vesicle v1">
                  <circle class="shell" r="15" fill="rgba(127,216,196,.16)" stroke="#8fe3cf" stroke-width="1.6"/>
                  <circle class="core" r="6.5" fill="#ffd479"/>
                  <g class="chol"><circle cy="-15" r="1.7" fill="#e2b25a"/><circle cx="13" cy="-7.5" r="1.7" fill="#e2b25a"/><circle cx="13" cy="7.5" r="1.7" fill="#e2b25a"/><circle cy="15" r="1.7" fill="#e2b25a"/><circle cx="-13" cy="7.5" r="1.7" fill="#e2b25a"/><circle cx="-13" cy="-7.5" r="1.7" fill="#e2b25a"/></g>
                </g></g>
                <g transform="translate(226,312)"><g class="vesicle v2">
                  <circle class="shell" r="14" fill="rgba(127,216,196,.16)" stroke="#8fe3cf" stroke-width="1.6"/>
                  <circle class="core" r="6" fill="#ffd479"/>
                  <g class="chol"><circle cy="-14" r="1.6" fill="#e2b25a"/><circle cx="12" cy="-7" r="1.6" fill="#e2b25a"/><circle cx="12" cy="7" r="1.6" fill="#e2b25a"/><circle cy="14" r="1.6" fill="#e2b25a"/><circle cx="-12" cy="7" r="1.6" fill="#e2b25a"/><circle cx="-12" cy="-7" r="1.6" fill="#e2b25a"/></g>
                </g></g>
                <g transform="translate(194,288)"><g class="vesicle v3">
                  <circle class="shell" r="13" fill="rgba(127,216,196,.16)" stroke="#8fe3cf" stroke-width="1.5"/>
                  <circle class="core" r="5.5" fill="#ffd479"/>
                  <g class="chol"><circle cy="-13" r="1.5" fill="#e2b25a"/><circle cx="11" cy="-6.5" r="1.5" fill="#e2b25a"/><circle cx="11" cy="6.5" r="1.5" fill="#e2b25a"/><circle cy="13" r="1.5" fill="#e2b25a"/><circle cx="-11" cy="6.5" r="1.5" fill="#e2b25a"/><circle cx="-11" cy="-6.5" r="1.5" fill="#e2b25a"/></g>
                </g></g>
                <g transform="translate(216,264)"><g class="vesicle v4">
                  <circle class="shell" r="12" fill="rgba(127,216,196,.16)" stroke="#8fe3cf" stroke-width="1.5"/>
                  <circle class="core" r="5" fill="#ffd479"/>
                  <g class="chol"><circle cy="-12" r="1.4" fill="#e2b25a"/><circle cx="10" cy="-6" r="1.4" fill="#e2b25a"/><circle cx="10" cy="6" r="1.4" fill="#e2b25a"/><circle cy="12" r="1.4" fill="#e2b25a"/><circle cx="-10" cy="6" r="1.4" fill="#e2b25a"/><circle cx="-10" cy="-6" r="1.4" fill="#e2b25a"/></g>
                </g></g>
              </g>
            </g>
            <path class="glass" d="M162 218 Q162 198 178 192 L190 188 L190 162 L230 162 L230 188 L242 192 Q258 198 258 218 L258 364 Q258 378 244 378 L176 378 Q162 378 162 364 Z" fill="url(#glass)" stroke="rgba(216,242,235,.55)" stroke-width="2"/>
            <path d="M171 238 Q171 224 181 218" stroke="#fff" stroke-opacity=".35" stroke-width="3" fill="none" stroke-linecap="round"/>
            <ellipse class="film" cx="210" cy="224" rx="42" ry="5" fill="#e8c27a"/>
            <g class="label">
              <rect x="166" y="330" width="88" height="40" rx="2" fill="#f7ead3"/>
              <rect x="166" y="330" width="88" height="4" fill="#d9a441"/>
              <path d="M180 348 h60 M180 356 h44" stroke="#c9b28a" stroke-width="2" stroke-linecap="round"/>
              <circle cx="232" cy="360" r="4" fill="#7fb08a" opacity=".7"/>
            </g>
            <g class="cork">
              <rect x="192" y="126" width="36" height="36" rx="3" fill="#a9744f"/>
              <rect x="192" y="126" width="36" height="7" rx="3" fill="#c98a5a"/>
            </g>
          </g>

          <g transform="translate(330,332)"><g class="box">
            <rect x="0" y="6" width="60" height="40" rx="3" fill="#e3cfa8"/>
            <rect x="0" y="0" width="60" height="8" rx="2" fill="#b98a4c"/>
            <path d="M12 22 h36 M12 30 h26" stroke="#c9b28a" stroke-width="2"/>
          </g></g>

          <g class="sparkles">
            <circle class="sparkle s1" cx="150" cy="242" r="2.6" fill="#ffe9b0"/>
            <circle class="sparkle s2" cx="270" cy="232" r="2.2" fill="#ffe9b0"/>
            <circle class="sparkle s3" cx="162" cy="298" r="2" fill="#ffe9b0"/>
            <circle class="sparkle s4" cx="266" cy="286" r="2.4" fill="#ffe9b0"/>
            <circle class="sparkle s5" cx="210" cy="196" r="2" fill="#ffe9b0"/>
          </g>
        </svg>
      </div>
      <p class="caption"><span id="step-name">a clean vial</span><small><b id="assembled">0</b> / 10 steps</small></p>
    </aside>
  </main>
</div>

<script src="game.js"></script>
</body>
</html>
